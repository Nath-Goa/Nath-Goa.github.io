<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nathan Kumtakar</title>
  <meta name="description" content="Nathan Kumtakar, front-end developer. Websites and landing pages built with HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://nathank.me/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3ENK%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --muted: #9a9a9a;
      --line: #333;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18vh 16px 48px;
      text-align: center;
    }
    h1 {
      margin: 0 0 56px;
      font-size: clamp(2.25rem, 1.5rem + 4vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .button {
      display: inline-block;
      padding: 16px 28px;
      border: 1px solid var(--text);
      border-radius: 4px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color .15s ease, color .15s ease;
    }
    .button:hover {
      background: var(--text);
      color: var(--bg);
    }
    .button:focus-visible,
    .small-link:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 4px;
    }
    .small-link {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.875rem;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
    }
    .small-link:hover { color: var(--text); border-color: var(--text); }
    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <!-- ===== YOUR NAME ===== -->

</body>
</html>
